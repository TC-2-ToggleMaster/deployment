  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          # Replace by proper ACCOUNT_ID and AWS_REGION.
          image: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/togglemaster-flag:latest
          imagePullPolicy: Always
          command: ["gunicorn"]
          args: ["--bind", "0.0.0.0:8002", "app:app"]
